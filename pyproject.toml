[project]
name = "bash-mcp"
version = "0.1.0"
description = "WSL bash executor MCP server — exposes WSL bash as a structured tool to MiniMax Code"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Jesus Becerra" }
]
dependencies = [
    "fastmcp==2.7.0",
    "pydantic>=2.10.6,<2.12.0",
    "tomli>=2.0; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bash_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
bash-mcp = "bash_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"
